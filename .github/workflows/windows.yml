name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Core tests, the end-to-end move included
        run: dotnet test src/FolderLink.Core.Tests --logger "console;verbosity=normal"
      - name: The app builds
        run: dotnet build -c Release src/FolderLink
